# =============================================================================
# SALFANET RADIUS — Nginx Reference Configuration
# =============================================================================
# This is a REFERENCE file only. The installer (vps-install/install-nginx.sh)
# generates the actual config automatically based on your environment.
#
# CLOUDFLARE USERS:
#   - If your domain uses Cloudflare orange-cloud (proxy), the installer
#     auto-detects this and generates a Cloudflare-compatible config.
#   - For Cloudflare Flexible SSL: origin receives HTTP from Cloudflare on port 80.
#     DO NOT use the HTTP→HTTPS redirect (Block 1) — it causes infinite redirects.
#     Use the radius.hotspotapp.net-style conf (production/nginx-radius.hotspotapp.net.conf).
#   - For Cloudflare Full SSL: origin receives HTTPS, use Block 3 with Let's Encrypt or
#     self-signed cert.
#
# VARIABLE REFERENCE:
#   YOUR_VPS_IP         → e.g. 103.151.140.110
#   radius.hotspotapp.net         → e.g. radius.hotspotapp.net (if set)
# =============================================================================

# ---------------------------------------------------------------------------
# OPTION A: Cloudflare Flexible SSL (domain behind Cloudflare orange-cloud)
# Replace "radius.hotspotapp.net" and include ONLY these 2 blocks.
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name radius.hotspotapp.net;
#     # → see production/nginx-radius.hotspotapp.net.conf for full routing
# }
# server {
#     listen 80 default_server;
#     listen [::]:80 default_server;
#     server_name _ YOUR_VPS_IP;
#     # → same routing as Block 2 below
# }

# ---------------------------------------------------------------------------
# OPTION B: Direct DNS (no Cloudflare proxy) — 4-block config below
# ---------------------------------------------------------------------------

# Block 1: HTTP domain → HTTPS redirect
# SKIP THIS if using Cloudflare Flexible SSL (causes infinite redirect loop)
server {
    listen 80;
    listen [::]:80;
    server_name radius.hotspotapp.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Block 2: HTTP default_server (direct IP access)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ YOUR_VPS_IP;

    client_max_body_size 100M;

    keepalive_timeout    300;
    keepalive_requests   10000;

    proxy_connect_timeout 600;
    proxy_send_timeout    600;
    proxy_read_timeout    600;
    send_timeout          600;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/salfanet-radius-access.log;
    error_log  /var/log/nginx/salfanet-radius-error.log;

    location /downloads/ {
        alias /var/www/salfanet-radius/public/downloads/;
        autoindex off;
        add_header Content-Disposition 'attachment';
    }

    location /_next/static/ {
        alias /var/www/salfanet-radius/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # API routes — Go backend (port 8080)
    # Customers API routes -> Next.js (uses getServerSession, bypasses Go JWT issue)
    location /api/customers/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
        add_header Pragma 'no-cache' always;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
    }
}

# Block 3: HTTPS domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name radius.hotspotapp.net;

    # Use Let's Encrypt certs (replace domain below).
    # For self-signed: ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate     /etc/letsencrypt/live/radius.hotspotapp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radius.hotspotapp.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    keepalive_timeout    300;
    keepalive_requests   10000;

    proxy_connect_timeout 600;
    proxy_send_timeout    600;
    proxy_read_timeout    600;
    send_timeout          600;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP - allow Cloudflare Insights beacon
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://api.fonnte.com https://api.wablas.com https://api.kirimi.id https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    access_log /var/log/nginx/salfanet-radius-access.log;
    error_log  /var/log/nginx/salfanet-radius-error.log;

    location /downloads/ {
        alias /var/www/salfanet-radius/public/downloads/;
        autoindex off;
        add_header Content-Disposition 'attachment';
    }

    # Static assets - long cache (hashed filenames change on rebuild)
    location /_next/static/ {
        alias /var/www/salfanet-radius/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    # Customers API routes -> Next.js (uses getServerSession, bypasses Go JWT issue)
    location /api/customers/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API routes — Go backend (port 8080), no cache, bypass Cloudflare CDN
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   CF-Connecting-IP $http_cf_connecting_ip;

        # Prevent Cloudflare and browser from caching API responses
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
        add_header CDN-Cache-Control 'no-store' always;
        add_header Cloudflare-CDN-Cache-Control 'no-store' always;
        add_header Pragma 'no-cache' always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Content-Type-Options;
    }

    # All other routes (pages) - no CDN cache
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;

        # Prevent Cloudflare from caching HTML pages
        add_header Cache-Control 'no-cache, must-revalidate' always;
        add_header CDN-Cache-Control 'no-store' always;
        add_header Cloudflare-CDN-Cache-Control 'no-store' always;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Content-Type-Options;
    }
}

# Block 4: HTTPS default_server (direct IP access)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _ YOUR_VPS_IP;

    # Use self-signed cert for direct IP access (no Let's Encrypt for bare IP).
    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

