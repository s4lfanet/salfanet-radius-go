# FreeRADIUS SQL module config for Docker
sql {
    driver = "rlm_sql_mysql"
    dialect = "mysql"
    server = "db"
    port = 3306
    login = "${DB_USER}"
    password = "${DB_PASSWORD}"
    radius_db = "${DB_NAME}"

    # Settings for safe accounting
    acct_table_prefix = "radacct"
    acct_table_client = "radacct"
    acct_table_user = "radacct"

    read_groups = yes

    # Read all accounting records for a user
    accounting_stop_on_timeout = yes

    # Table mappings
    postauth_table = "radpostauth"
    authcheck_table = "radcheck"
    authreply_table = "radreply"
    groupcheck_table = "radgroupcheck"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"

    # Remove stale sessions
    deletestalesessions = yes

    # SQL logging
    sqllog = no
}
