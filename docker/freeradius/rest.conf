# FreeRADIUS REST module config for Docker
# Points to the Go API backend inside Docker network
rest {
    connect_uri = "http://api:8080"

    # Auth endpoint
    authorize {
        uri = "/api/radius/authorize"
        method = "post"
        body = "json"
    }

    # Accounting endpoints
    accounting {
        start {
            uri = "/api/radius/accounting/start"
            method = "post"
            body = "json"
        }
        stop {
            uri = "/api/radius/accounting/stop"
            method = "post"
            body = "json"
        }
        interim {
            uri = "/api/radius/accounting/interim"
            method = "post"
            body = "json"
        }
    }

    # Post-auth endpoint
    post-auth {
        uri = "/api/radius/postauth"
        method = "post"
        body = "json"
    }

    # TLS settings (not needed for internal Docker network)
    tls {
        verify_mode = "none"
    }

    # Connection pool
    pool {
        max_connections = 16
        lifetime = 0
        idle_timeout = 60
    }
}
