# FreeRADIUS clients config for Docker
# Allow connections from the docker network
client docker_net {
    ipaddr = 0.0.0.0/0
    secret = ${SHARED_SECRET}
    require_message_authenticator = no
    nas_type = other
}

# Local NAS/router (configure your real NAS IP here)
client nas_local {
    ipaddr = 127.0.0.1
    secret = ${SHARED_SECRET}
    require_message_authenticator = no
}
